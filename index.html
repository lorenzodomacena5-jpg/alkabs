<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        <p>Manage your student records easily.</p>

        <div class="form-container">
            <h2>Add Student</h2>
            <input type="text" id="studentId" placeholder="Student ID">
            <input type="text" id="studentName" placeholder="Full Name">
            <input type="text" id="course" placeholder="Course">
            <input type="number" id="year" placeholder="Year Level">
            <button id="addBtn" onclick="addStudent()">Add Student</button>
        </div>

        <div class="records">
            <h2>Student Records</h2>
            <input type="text" id="searchInput" placeholder="Search student..." onkeyup="searchStudent()">
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Year</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTable"></tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
